"on":
  pull_request:
    paths:
      - .github/actionlint.yaml
      - .github/workflows/**
  push:
    branches:
      - develop
      - main
      - master
    paths:
      - .github/workflows/**
jobs:
  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Run actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          matcher: true
name: Actionlint
permissions:
  contents: read
