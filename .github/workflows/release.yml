name: Release

# On every push to main, compute the next version and release notes from the
# Conventional Commits since the last tag (git-cliff — the version is derived,
# never typed), then tag the commit and cut a GitHub release. One commit on main
# = one release. No-op when there is nothing
# new to release (git-cliff yields the same version).
#
# A new release is then built once and published from the same workflow: a
# release created with github.token does not trigger other workflows.
# TestPyPI -> PyPI (Trusted Publishing, no token) -> Docker Hub image.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create tags and releases
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # full history + tags for changelog and version bump

      - name: Install git-cliff
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: git-cliff

      - name: Compute next version
        id: version
        run: |
          set +e
          NEXT="$(git cliff --bumped-version 2>cliff.err)"
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "git-cliff --bumped-version failed (rc=$rc):"; cat cliff.err || true
          fi
          echo "computed version: '${NEXT}'"
          echo "tag=${NEXT}" >> "$GITHUB_OUTPUT"

      - name: Release if the version advanced
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            echo "git-cliff produced no version; nothing to release."; exit 0
          fi
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; nothing new to release."; exit 0
          fi
          git cliff --tag "$TAG" --unreleased --strip all --output RELEASE_NOTES.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --notes-file RELEASE_NOTES.md
          echo "released=true" >> "$GITHUB_OUTPUT"
        id: release

  build:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release.outputs.tag }}
          fetch-depth: 0  # setuptools-scm reads the version from the tag

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Build and check the distribution
        run: |
          python -m pip install --only-binary :all: "build==1.6.1" twine
          python -m build
          python -m twine check --strict dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/prism-ai-lint
    permissions:
      id-token: write  # Trusted Publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/prism-ai-lint
    permissions:
      id-token: write  # Trusted Publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  docker:
    needs: [release, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image tags
        id: tags
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            docker.io/chrysa/prism-ai-lint:${{ steps.tags.outputs.version }}
            docker.io/chrysa/prism-ai-lint:latest
