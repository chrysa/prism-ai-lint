name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  pre-commit:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install dev tooling
        run: |
          python - <<'PY'
          import subprocess
          import sys
          import tomllib

          with open("pyproject.toml", "rb") as fh:
              deps = tomllib.load(fh)["project"]["optional-dependencies"]["dev"]
          subprocess.check_call([sys.executable, "-m", "pip", "install", "--upgrade", *deps])
          PY
      - name: Run pre-commit
        env:
          SKIP: no-commit-to-branch
        run: pre-commit run --all-files

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # prism-ai-lint supports Python 3.13 and newer, never lower.
        python-version: ["3.13", "3.14"]
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # SonarCloud needs full history for blame and new-code detection
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev tooling
        run: |
          python - <<'PY'
          import subprocess
          import sys
          import tomllib

          with open("pyproject.toml", "rb") as fh:
              deps = tomllib.load(fh)["project"]["optional-dependencies"]["dev"]
          subprocess.check_call([sys.executable, "-m", "pip", "install", "--upgrade", *deps])
          PY
      - name: Ruff check
        run: python -m ruff check prism_ai_lint prism-ai-lint.py tests
      - name: Ruff format check
        run: python -m ruff format --check prism_ai_lint prism-ai-lint.py tests
      - name: Type check
        run: python -m mypy
      - name: Run tests
        run: python -m pytest -q
      - name: Self-check
        run: python tests/_selfcheck.py
      - name: Coverage (CLI subprocesses included; floor 60%)
        run: |
          rm -f .coverage .coverage.*
          mkdir -p .reports
          COVERAGE_RUN=1 COVERAGE_FILE="$PWD/.coverage" python -m coverage run \
            --parallel-mode --rcfile="$PWD/pyproject.toml" -m pytest -q
          COVERAGE_FILE="$PWD/.coverage" python -m coverage combine --rcfile="$PWD/pyproject.toml"
          COVERAGE_FILE="$PWD/.coverage" python -m coverage report --rcfile="$PWD/pyproject.toml" \
            --fail-under=60
          COVERAGE_FILE="$PWD/.coverage" python -m coverage xml --rcfile="$PWD/pyproject.toml" \
            -o .reports/coverage.xml
      - name: SonarCloud scan (coverage included)
        if: matrix.python-version == '3.13' && env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
